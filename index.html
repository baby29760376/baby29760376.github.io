<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>托育人員鼓勵機制試辦計畫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FDB813',
            primaryDark: '#E5A511',
            secondary: '#FEF3C7',
            accent: '#FBBF24',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gradient-to-br from-amber-50 via-yellow-50 to-orange-50 min-h-screen">
  <div id="app"></div>

  <!-- 載入所有 JavaScript 檔案 -->
  <!-- 僅在本機載入 js/config.local.js（不進版控，見 js/config.local.example.js），正式環境不發此請求 -->
  <script>
    if (['localhost', '127.0.0.1'].includes(location.hostname)) {
      document.write('<script src="js/config.local.js"><\/script>');
    }
  </script>
  <!-- DOMPurify：清理 news.content_html 富文字；固定版本 + SRI，載入失敗時 sanitizeHtml() 會改為跳脫顯示 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.17/purify.min.js"
          integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/change-password.js"></script>
  <script src="js/pages/forgot-password.js"></script>
  <script src="js/pages/provider.js"></script>
  <script src="js/pages/parent.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/pages/news-detail.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
